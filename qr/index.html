<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Code · Pearl & Aman</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=Pinyon+Script&family=Cinzel&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #232c1c; font-family: "Cormorant Garamond", serif; color: #2a2620; }
    .card { background: #f6f1e8; padding: 2.5rem 2rem; border-radius: 6px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    h1 { font-family: "Pinyon Script", cursive; font-weight: 400; color: #5c1a24; font-size: 3rem; margin: 0; }
    p { margin: .3rem 0 1.5rem; font-family: Cinzel, serif; font-size: .8rem; letter-spacing: .15em; }
    #qr { display: inline-block; padding: 14px; background: #f6f1e8; border: 1px solid #b89a5e; }
    .url { font-style: italic; font-family: inherit; letter-spacing: 0; font-size: .95rem; word-break: break-all; }
    .warn { color: #a0303c; }
    button { margin-top: 1rem; font-family: Cinzel, serif; letter-spacing: .2em; font-size: .75rem; text-transform: uppercase; padding: .8rem 1.5rem; border-radius: 999px; border: 0; background: #5c1a24; color: #efe7da; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pearl &amp; Aman</h1>
    <p>Scan to view our wedding website</p>
    <div id="qr"></div>
    <p class="url" id="url"></p>
    <button id="download">Download PNG</button>
  </div>

  <script src="../vendor/qrcode.min.js"></script>
  <script type="module">
    const site = (await (await fetch("../content/content.json", { cache: "no-cache" })).json()).site;
    const url = site.siteUrl || new URL("../", location.href).href;
    const urlEl = document.getElementById("url");
    urlEl.textContent = url;
    if (!site.siteUrl) {
      urlEl.classList.add("warn");
      urlEl.textContent += " (set site.siteUrl in content/content.json once the site is published)";
    }
    new QRCode(document.getElementById("qr"), {
      text: url, width: 240, height: 240,
      colorDark: "#2f3a26", colorLight: "#f6f1e8",
      correctLevel: QRCode.CorrectLevel.H,
    });
    document.getElementById("download").onclick = () => {
      const canvas = document.querySelector("#qr canvas");
      const a = document.createElement("a");
      a.download = "pearl-aman-qr.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    };
  </script>
</body>
</html>
