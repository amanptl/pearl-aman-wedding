  <meta name="twitter:card" content="summary_large_image" />
  <!-- Show the envelope intro at first paint (before JS boots) when main.js would show it anyway: first visit this session, on home. -->
  <script>try{if(!sessionStorage.getItem("pa.intro")&&/^(#|#home(\/.*)?)?$/.test(location.hash)&&!/[?&](edit=1|intro=0)/.test(location.search))document.documentElement.classList.add("intro-early")}catch(e){}</script>
  <script>if(!/[?&](content|edit)=/.test(location.search))window.__content=fetch("content/content.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json()});</script>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/gilda-display-latin.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/bodoni-moda-latin.woff2" crossorigin />
  <link rel="stylesheet" href="src/styles/site.css" />
  <link rel="preload" as="image" href="assets/img/home-flatlay.webp" fetchpriority="high" />
  <link rel="modulepreload" href="src/main.js" />
  <link rel="modulepreload" href="src/lib/dom.js" />

<body>
  <div id="boot" class="boot" role="status"><p>Loading the invitation&hellip;</p></div>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="intro" class="intro" role="dialog" aria-modal="true" aria-label="Invitation" hidden>
    <button type="button" class="btn btn--light btn--small intro-skip" id="intro-skip">Skip</button>
    <p class="intro-line">You're cordially invited&hellip;</p>
    <button type="button" class="intro-open" id="intro-open" aria-label="Open the invitation">
      <span class="intro-env" aria-hidden="true">
        <span class="ienv-body"></span>
        <span class="ienv-flap"></span>
        <span class="ienv-seal"></span>
        <img class="ienv-flowers" src="assets/img/floral-divider-600.webp" alt="" width="600" height="338" decoding="async" />
      </span>
    </button>
    <p class="intro-line intro-hint" aria-hidden="true">Tap the envelope to open&hellip;</p>
  </div>

  <div id="app" hidden>
    <header class="site-header" id="site-header">
      <div class="banner" data-decor aria-hidden="true"><span class="script">Pearl &amp; Aman</span></div>
    </header>
    <nav class="top-nav" id="top-nav" aria-label="Main"></nav>
    <div class="guest-strip" id="guest-badge"></div>
    <main id="main"></main>
    <nav class="tabbar" id="tabbar" aria-label="Quick"></nav>
    <button type="button" class="help-fab" id="help" hidden></button>
  </div>

  <div id="toast" class="toast-region" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem;color:#ece8df">This invitation needs JavaScript to display. Please enable it, or contact the couple directly.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
